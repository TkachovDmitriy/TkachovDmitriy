name: Generate GitHub statistics

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - profile-terminal-preview

permissions: {}

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light stats
        uses: readme-tools/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&hide_border=true&theme=default
          path: dist/stats.svg
          token: ${{ github.token }}

      - name: Generate dark stats
        uses: readme-tools/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&hide_border=true&theme=github_dark
          path: dist/stats-dark.svg
          token: ${{ github.token }}

      - name: Generate light languages
        uses: readme-tools/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=420&hide_border=true&theme=default
          path: dist/languages.svg
          token: ${{ github.token }}

      - name: Generate dark languages
        uses: readme-tools/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=420&hide_border=true&theme=github_dark
          path: dist/languages-dark.svg
          token: ${{ github.token }}

      - name: Upload generated cards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-stats
          path: dist
          retention-days: 1

  publish:
    needs: generate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download generated cards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-stats
          path: dist

      - name: Publish cards to stats-output branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b stats-output
          git add .
          git commit -m "Update GitHub statistics"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:stats-output
